name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          
          # Target space: Uses HF_SPACE secret if set, otherwise defaults to minepulse/afk-cloud
          TARGET_SPACE="${HF_SPACE:-minepulse/afk-cloud}"
          echo "Hugging Face Space Target: $TARGET_SPACE"
          
          git remote add space "https://user:$HF_TOKEN@huggingface.co/spaces/$TARGET_SPACE"
          
          # Fetch remote space history
          git fetch space main || true
          git fetch space master || true
          
          # Merge remote space metadata if exists
          git merge space/main -m "Merge Hugging Face Space Metadata" --allow-unrelated-histories -X ours || true
          
          # Push to Hugging Face Space
          git push space HEAD:main --force


