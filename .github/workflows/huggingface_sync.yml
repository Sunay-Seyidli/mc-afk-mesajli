name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git remote add space https://Sunay-Seyidli:$HF_TOKEN@huggingface.co/spaces/Sunay-Seyidli/mc-afk-mesajli
          
          # Fetch remote space history
          git fetch space main || true
          git fetch space master || true
          
          # Merge remote space metadata if exists
          git merge space/main -m "Merge Hugging Face Space Metadata" --allow-unrelated-histories -X ours || true
          
          # Push to Hugging Face Space
          git push space HEAD:main --force

